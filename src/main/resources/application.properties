spring.application.name=ms-picking-service
server.port=8084
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ms_picking}

# Versión de la aplicación (filtrada desde pom.xml en build time)
info.app.version=@project.version@

# Endpoints operativos: health para healthchecks de Docker/Swarm, info para verificar la versión desplegada
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.show-details=never

# Probes separadas: liveness = el proceso responde (lo usa el healthcheck de Docker).
# Si Mongo cae, la app sigue viva y no debe reiniciarse en bucle; readiness incluye la BD.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo
