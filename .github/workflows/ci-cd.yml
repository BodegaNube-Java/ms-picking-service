name: CI/CD ms-picking-service

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-picking-service-${{ github.ref }}
  # En PRs se cancela la ejecución anterior; un despliegue en curso nunca se cancela
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------
  # 1. CI: compila y ejecuta todas las pruebas
  # ---------------------------------------------------------------
  test:
    name: CI - build y tests
    runs-on: ubuntu-latest
    # El smoke test de contexto crea el índice único contra una base de datos real
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/ms_picking
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Compilar, testear y empaquetar (mvnw verify)
        run: ./mvnw -B verify

      - name: Guardar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ms-picking-service-jar
          path: target/*.jar

  # ---------------------------------------------------------------
  # 2. CD (parte 1): construye y publica la imagen Docker versionada
  # ---------------------------------------------------------------
  package:
    name: CD - publicar imagen Docker
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.version.outputs.image }}
      deploy_tag: ${{ steps.version.outputs.deploy_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Calcular versión y tags
        id: version
        run: |
          VERSION="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          # GHCR exige el nombre del repositorio en minúsculas
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ms-picking-service"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Release: el tag v1.2.3 debe coincidir exactamente con la versión del pom
            if [[ "${GITHUB_REF_NAME#v}" != "${VERSION}" ]]; then
              echo "::error::El tag ${GITHUB_REF_NAME} no coincide con la versión del pom (${VERSION})"
              exit 1
            fi
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
            DEPLOY_TAG="${VERSION}"
          else
            # Build de main: tag inmutable por commit
            TAGS="${IMAGE}:${VERSION}-${SHORT_SHA}"
            DEPLOY_TAG="${VERSION}-${SHORT_SHA}"
          fi

          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "deploy_tag=${DEPLOY_TAG}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "Publicará: ${TAGS}"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3. CD (parte 2): despliega en el clúster Docker Swarm y verifica
  # ---------------------------------------------------------------
  deploy:
    name: CD - desplegar en Docker Swarm
    needs: package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    env:
      SWARM_HOST: ${{ secrets.SWARM_HOST }}
      SWARM_USER: ${{ secrets.SWARM_USER }}
      PICKING_IMAGE: ${{ needs.package.outputs.image }}:${{ needs.package.outputs.deploy_tag }}
    steps:
      - name: Descargar código (para docker-compose.yml)
        uses: actions/checkout@v4

      - name: Preparar acceso SSH al manager
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SWARM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${SWARM_HOST}" >> ~/.ssh/known_hosts

      - name: Copiar stack y desplegar
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.yml "${SWARM_USER}@${SWARM_HOST}:bodeganube-stack.yml"
          ssh -i ~/.ssh/id_deploy "${SWARM_USER}@${SWARM_HOST}" bash -s <<REMOTE
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          PICKING_IMAGE="${PICKING_IMAGE}" docker stack deploy \
            --with-registry-auth --prune -c bodeganube-stack.yml bodeganube
          REMOTE

      - name: Esperar a que todas las réplicas estén arriba
        run: |
          for intento in $(seq 1 30); do
            REPLICAS="$(ssh -i ~/.ssh/id_deploy "${SWARM_USER}@${SWARM_HOST}" \
              "docker service ls --filter name=bodeganube_ms-picking --format '{{.Replicas}}'")"
            echo "Intento ${intento}: réplicas ${REPLICAS}"
            RUNNING="${REPLICAS%%/*}"
            DESIRED="${REPLICAS##*/}"
            if [[ -n "${DESIRED}" && "${RUNNING}" == "${DESIRED}" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::El servicio no convergió a tiempo"
          exit 1

      - name: Smoke test en la nube (health y versión desplegada)
        run: |
          BASE="http://${SWARM_HOST}:8084"
          curl --fail --silent --retry 10 --retry-delay 6 --retry-all-errors "${BASE}/actuator/health" | tee /tmp/health.json
          grep -q '"status":"UP"' /tmp/health.json
          curl --fail --silent "${BASE}/actuator/info" | tee /tmp/info.json
          grep -q "\"version\":\"${{ needs.package.outputs.version }}\"" /tmp/info.json
          echo "Desplegado ms-picking-service ${{ needs.package.outputs.version }} OK"
